version: "3.8"
services:
  postgres:
    image: pgvector/pgvector:pg16  # postgres:16 + pgvector 扩展（volume 兼容，用于经验/覆盖项语义检索）
    container_name: test_platform_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: testplatform
      POSTGRES_PASSWORD: testplatform_dev_pwd
      POSTGRES_DB: test_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testplatform -d test_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: test_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
