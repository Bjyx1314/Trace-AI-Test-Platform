# 生产部署：postgres + redis + backend(FastAPI+PC框架) + frontend(nginx)
# 用法(服务器)：
#   1) git clone 框架仓库：web_ui_automation→/opt/framework(PC+移动端)、interfaceauto2.0→/opt/framework-inter(接口)
#      可用 deploy/setup_frameworks.py 一键完成
#   2) 写 backend/.env(无 mock，DATABASE_URL 指 postgres 服务)
#   3) docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16  # postgres:16 + pgvector 扩展（volume 兼容，用于经验/覆盖项语义检索）
    container_name: tp_pg
    restart: unless-stopped
    # 强制服务端会话时区为东八区：asyncpg 用的是服务端 timezone GUC，
    # 仅靠 TZ 环境变量改不动已 initdb 的 GUC，必须用 -c timezone 覆盖，
    # 这样 func.now() 写入(naive)的 created_at 即为中国本地时间(CST)。
    command: ["postgres", "-c", "timezone=Asia/Shanghai", "-c", "log_timezone=Asia/Shanghai"]
    environment:
      POSTGRES_USER: testplatform
      POSTGRES_PASSWORD: testplatform_dev_pwd
      POSTGRES_DB: test_platform
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testplatform -d test_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tp_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: tp_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FRAMEWORK_ROOT: /opt/framework
      INTERFACE_FRAMEWORK_ROOT: /opt/framework-inter
      TZ: Asia/Shanghai
      FRAMEWORK_PYTHON: /app/fw-venv/bin/python   # 框架登录子进程用的独立 venv(装框架依赖 appium 等)
    volumes:
      - /opt/framework:/opt/framework
      - /opt/framework-inter:/opt/framework-inter
      - backend_uploads:/app/uploads
      - backend_login:/app/login_states
      - backend_logintmp:/app/login_tmp
      - backend_repos:/app/business_repos                # 被测业务仓工作区(持久，跨部署复用；避免每次重部署 full clone)
      - /opt/test-platform/worker-dist:/app/worker-dist  # tp-worker.exe 放这(持久，供下载)
      - /opt/test-platform/fw-venv:/app/fw-venv          # 框架依赖独立 venv(持久，PC web 登录子进程用)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
  backend_login:
  backend_logintmp:
  backend_repos:
